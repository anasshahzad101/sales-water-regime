<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>WR Sales Hub — Prototype</title>
<link rel="icon" href="uploads/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.469.0/font/lucide.css">
<style>body{margin:0;background:#DCE5DF;font-family:Inter,system-ui,sans-serif;color:#06231A;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}button{font:inherit}a{color:#007A3A;text-decoration:none}a:hover{color:#0A5C30;text-decoration:underline}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="position:sticky;top:0;z-index:100;background:#FFFFFF;border-bottom:1px solid #E3ECE6;box-shadow:0 8px 24px -16px rgba(6,35,26,0.25)">
    <div style="display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap">
      <a href="WR Sales Hub Screens.dc.html" style="display:flex;align-items:center;gap:10px;color:#06231A;text-decoration:none"><img src="uploads/favicon.png" alt="Water Regime" style="height:26px;display:block"><span style="font-family:Sora,sans-serif;font-size:15px;font-weight:600">Prototype</span></a>
      <div style="display:flex;gap:6px;flex-wrap:wrap;flex:1">
        <sc-for list="{{ flows }}" as="f" hint-placeholder-count="4">
          <button onClick="{{ f.start }}" style="height:34px;padding:0 12px 0 8px;border-radius:999px;border:1px solid {{ f.bd }};background:{{ f.bg }};color:{{ f.fg }};font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap"><span style="width:20px;height:20px;border-radius:999px;background:{{ f.nb }};color:{{ f.nf }};font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ f.n }}</span>{{ f.label }}</button>
        </sc-for>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <sc-for list="{{ segs }}" as="s" hint-placeholder-count="2">
          <div style="display:flex;padding:3px;border-radius:999px;background:#EEF5F0;border:1px solid #E3ECE6"><sc-for list="{{ s.opts }}" as="o" hint-placeholder-count="2"><button onClick="{{ o.pick }}" style="height:28px;padding:0 10px;border:0;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;background:{{ o.bg }};color:{{ o.fg }};box-shadow:{{ o.sh }};display:flex;align-items:center;gap:5px"><i class="icon-{{ o.icon }}" style="font-size:13px;line-height:1"></i>{{ o.label }}</button></sc-for></div>
        </sc-for>
        <span style="position:relative;display:flex"><select value="{{ role }}" onChange="{{ onRole }}" aria-label="Role" style="appearance:none;-webkit-appearance:none;height:34px;padding:0 30px 0 12px;border-radius:999px;border:1px solid #C9D8CE;background:#FFFFFF;color:#06231A;font-size:13px;font-weight:600;outline:none"><option value="sales">Sales · Ali Raza</option><option value="manager">Manager · Bilal Ahmed</option><option value="ceo">CEO · Zainab Qureshi</option><option value="admin">Admin · Kamran Javed</option></select><i class="icon-chevron-down" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:14px;line-height:1;color:#637469;pointer-events:none"></i></span>
        <button onClick="{{ restart }}" style="height:34px;padding:0 12px;border:1px solid #C9D8CE;border-radius:999px;background:#FFFFFF;color:#06231A;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px"><i class="icon-rotate-ccw" style="font-size:14px;line-height:1"></i>Restart</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 20px 10px;border-top:1px solid #EEF5F0;font-size:13px;color:#3D4F46"><i class="icon-route" style="font-size:15px;line-height:1;color:#007A3A"></i><b style="color:#06231A">{{ cur.label }}:</b><span>{{ cur.steps }}</span></div>
  </header>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;display:flex;flex-direction:column">
      <dc-import name="WR Sales Hub App" device="desktop" theme="{{ theme }}" role="{{ role }}" page="{{ page }}" company="{{ company }}" deal="{{ deal }}" reset-key="{{ resetKey }}" hint-size="100%,900px" style="width:100%"></dc-import>
    </div>
  </sc-if>
  <sc-if value="{{ isPhone }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:flex;justify-content:center;padding:28px 16px 48px">
      <div style="width:410px;height:864px;padding:10px;border-radius:56px;background:#0C1916;box-shadow:0 24px 60px -16px rgba(6,35,26,0.45)">
        <div style="width:390px;height:844px;border-radius:46px;overflow:hidden;background:#F3F8F4">
          <dc-import name="WR Sales Hub App" device="phone" theme="{{ theme }}" role="{{ role }}" page="{{ page }}" company="{{ company }}" deal="{{ deal }}" reset-key="{{ resetKey }}" hint-size="390px,844px" style="width:390px;height:844px"></dc-import>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const FLOWS = [
  {label:'Sign in → set an overdue outcome', role:'sales', page:'signin', steps:'Sign in (any password of 6+ characters) → My Week → Lyallpur Denim Mills is Overdue → pick an outcome → write the late reason → Save. The My Week badge turns from red to green.'},
  {label:'Log a visit from an account', role:'sales', page:'account', company:'c1', steps:'On Lyallpur Denim Mills, tap Log a visit (company is pre-filled) → choose a type and outcome → Save visit → you land back on the account with the new visit at the top of the timeline.'},
  {label:'Move a deal to Lost', role:'sales', page:'deal', deal:'d4', steps:'On RO + UF upgrade (stuck 41 d), under Change stage pick Lost → choose a reason (try Other without a note to see the error) → Move to Lost → Undo is in the toast.'},
  {label:'CEO drills into a flag', role:'ceo', page:'cockpit', steps:'Cockpit (read-only, no edit controls) → click the Stuck flag → read-only list → open a deal or account, still read-only. Switch tabs to see the other flags.'}
];
class Component extends DCLogic {
  state = {flow:0, device:'desktop', theme:'light', role:'sales', page:'signin', company:'', deal:'', resetKey:1};
  start(i) { const f = FLOWS[i]; this.setState(s => ({flow:i, role:f.role, page:f.page, company:f.company || '', deal:f.deal || '', resetKey:s.resetKey + 1})); }
  renderVals() {
    const s = this.state;
    const seg = on => on ? {bg:'#FFFFFF', fg:'#06231A', sh:'0 1px 2px rgba(6,35,26,0.12)'} : {bg:'transparent', fg:'#5A6B62', sh:'none'};
    return {
      flows: FLOWS.map((f, i) => { const on = s.flow === i; return {label:f.label, n:i + 1, bd: on ? '#007A3A' : '#C9D8CE', bg: on ? '#E7F7EE' : '#FFFFFF', fg: on ? '#007A3A' : '#06231A', nb: on ? '#007A3A' : '#EEF5F0', nf: on ? '#FFFFFF' : '#5A6B62', start: () => this.start(i)}; }),
      cur: FLOWS[s.flow],
      segs: [
        {opts:[['desktop','Desktop','monitor'],['phone','Phone','smartphone']].map(([k, l, icon]) => ({label:l, icon, ...seg(s.device === k), pick: () => this.setState({device:k})}))},
        {opts:[['light','Light','sun'],['dark','Dark','moon']].map(([k, l, icon]) => ({label:l, icon, ...seg(s.theme === k), pick: () => this.setState({theme:k})}))}
      ],
      role: s.role, onRole: e => { const r = e.target.value; this.setState(st => ({role:r, page: r === 'ceo' ? 'cockpit' : 'myweek', resetKey: st.resetKey + 1})); },
      restart: () => this.start(s.flow),
      isDesktop: s.device === 'desktop', isPhone: s.device === 'phone',
      theme: s.theme, page: s.page, company: s.company, deal: s.deal, resetKey: s.resetKey
    };
  }
}
</script>
</body>
</html>
