{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-wr-700 mb-4">Users</h1>

<div class="grid md:grid-cols-3 gap-4">
  <div class="bg-white border rounded-lg p-4 md:col-span-2">
    <table class="w-full text-sm">
      <thead class="text-slate-500 text-xs"><tr>
        <th class="text-left py-1">Name</th><th class="text-left">Email</th><th class="text-left">Role</th><th class="text-left">Region</th><th></th>
      </tr></thead>
      <tbody class="divide-y">
      {% for u in users %}
        <tr>
          <td class="py-2">{{ u.name }}</td>
          <td>{{ u.email }}</td>
          <td class="capitalize">{{ u.role }}</td>
          <td>{{ u.region or '—' }}</td>
          <td class="text-right">
            <form method="post" action="{{ url_for('admin.toggle_user', uid=u.id) }}">
              <button class="text-xs px-2 py-0.5 rounded {% if u.is_active_flag %}bg-emerald-100 text-emerald-700{% else %}bg-slate-200 text-slate-600{% endif %}">
                {{ 'Active' if u.is_active_flag else 'Inactive' }}
              </button>
            </form>
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="bg-white border rounded-lg p-4">
    <h2 class="font-semibold mb-3">Add user</h2>
    <form method="post" action="{{ url_for('admin.new_user') }}" class="space-y-2 text-sm">
      <input name="name" required placeholder="Name *" class="w-full border rounded px-2 py-1" />
      <input name="email" type="email" required placeholder="Email *" class="w-full border rounded px-2 py-1" />
      <input name="password" type="password" required minlength="8" placeholder="Password (8+ chars) *" class="w-full border rounded px-2 py-1" />
      <select name="role" class="w-full border rounded px-2 py-1">
        {% for r in roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
      </select>
      <input name="region" placeholder="Region (optional)" class="w-full border rounded px-2 py-1" />
      <button class="bg-wr-600 text-white px-3 py-1 rounded">Create user</button>
    </form>
  </div>
</div>
{% endblock %}
