{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white border rounded-lg p-6">
  <h1 class="text-xl font-bold mb-4">Change password</h1>
  <form method="post" class="space-y-3">
    <div><label class="block text-sm">Current password</label>
      <input name="old_password" type="password" required class="w-full border rounded px-3 py-2" /></div>
    <div><label class="block text-sm">New password (min 8 chars)</label>
      <input name="new_password" type="password" required minlength="8" class="w-full border rounded px-3 py-2" /></div>
    <button class="bg-wr-600 text-white px-4 py-2 rounded">Update</button>
  </form>
</div>
{% endblock %}
